[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-mlops"
version = "0.1.0"
description = "Heart disease prediction MLOps project"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "MLOps Assignment" }
]
dependencies = [
  "pandas==2.2.3",
  "numpy==2.1.2",
  "scikit-learn==1.5.2",
  "joblib==1.4.2",
  "mlflow==2.18.0",
  "fastapi==0.115.0",
  "uvicorn==0.30.6",
  "pydantic==2.9.2",
  "pytest==8.3.3",
  "httpx==0.27.2",
  "matplotlib==3.9.2",
  "seaborn==0.13.1",
  "plotly==5.24.1",
  "requests==2.32.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501"]
