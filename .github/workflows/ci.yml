name: Heart Disease MLOps CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-test-train:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Prepare run reports
        run: mkdir -p reports

      - name: Install dependencies
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee reports/dependencies.log
          python -m pip install -r requirements.txt 2>&1 | tee -a reports/dependencies.log
          {
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Run attempt: $GITHUB_RUN_ATTEMPT"
            echo "Commit: $GITHUB_SHA"
            echo "Python: $(python --version)"
          } > reports/run-metadata.txt

      - name: Lint code
        run: |
          set -o pipefail
          python -m ruff check . 2>&1 | tee reports/lint.log

      - name: Download dataset
        run: |
          set -o pipefail
          python scripts/download_data.py 2>&1 | tee reports/data-download.log

      - name: Run unit tests
        run: |
          set -o pipefail
          python -m pytest --junitxml=reports/pytest-results.xml -q 2>&1 | tee reports/pytest.log

      - name: Train model
        run: |
          set -o pipefail
          python scripts/train_model.py 2>&1 | tee reports/training.log

      - name: Upload workflow reports and model artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heart-disease-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            artifacts/
            mlruns/
            data/heart_preprocessed.csv
          if-no-files-found: warn
